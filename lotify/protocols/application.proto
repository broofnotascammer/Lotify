syntax = "proto3";

package lotify.protocol;

message LaunchApplicationRequest {
  string package_name = 1;
  string apk_path = 2;
  repeated string arguments = 3;
  map<string, string> environment = 4;
}

message LaunchApplicationResponse {
  bool success = 1;
  uint32 app_pid = 2;
  string error_reason = 3;
}

message TerminateApplicationRequest {
  string package_name = 1;
  bool force = 2;
}

message TerminateApplicationResponse {
  bool success = 1;
}

message InstalledAppInfo {
  string package_name = 1;
  string version_name = 2;
  uint32 version_code = 3;
  string apk_path = 4;
  string display_name = 5;
  bool is_compatible = 6;
}

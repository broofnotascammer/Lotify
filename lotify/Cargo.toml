[workspace]
resolver = "2"
members = [
    "apps/lotify-gtk",
    "crates/lotify-core",
    "crates/lotify-protocol",
    "crates/lotify-config",
    "crates/lotify-logging",
    "crates/lotify-errors",
    "crates/lotify-supervisor",
    "crates/lotify-android-bootstrap",
    "crates/lotify-android-runtime",
    "crates/lotify-binder",
    "crates/lotify-android-system",
    "crates/lotify-framework-bridge",
    "crates/lotify-graphics",
    "crates/lotify-audio",
    "crates/lotify-apk",
    "tools/apk-inspect",
    "tools/lotify-doctor",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Lotify Authors <dev@lotify.org>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lotify/lotify"
homepage = "https://lotify.org"
readme = "README.md"
rust-version = "1.80.0"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"
prost = "0.13.3"
prost-types = "0.13.3"
bytes = "1.7.2"
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.16"
tokio-util = { version = "0.7.12", features = ["codec"] }
nix = { version = "0.29.0", features = ["socket", "ucred", "signal", "process", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
thiserror = "1.0.64"
anyhow = "1.0.89"
gtk4 = { version = "0.9.2", features = ["v4_14"] }
libadwaita = { version = "0.7.1", features = ["v1_5"] }
glib = "0.20.0"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
memmap2 = "0.9.4"
libc = "0.2.158"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
